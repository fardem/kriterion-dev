# Der Pruefstand laeuft bei jedem Push auf main.
#
# Bisher lief er nur, wenn jemand daran dachte. Die Schluesselwoerter sind
# englisch, weil GitHub sie so liest; alles andere steht auf Deutsch.
name: Pruefstand

# EIN EREIGNIS, UND ES HEISST PUSH AUF main -- entschieden vom Betreiber am
# 10. September 2026. Vorher hing der Lauf an zwei Ereignissen (Push und
# Anfrage), und eine Bedingung am Auftrag waehlte den zweiten Lauf am selben
# Stand ab (Weg B, 0.25.0). Die Bedingung ist damit gegenstandslos und
# weggefallen: bei einem einzigen Ereignis gibt es keinen zweiten Lauf, den
# sie noch abwaehlen koennte.
#
# WAS DAMIT WEGFAELLT, UND ES FAELLT NAMENTLICH:
#   1. DER LAUF AUF EINEM ZWEIG DIESES REPOSITORIUMS. Ein Zweig wird nicht
#      mehr geprueft, bevor er in main steht -- die erste Pruefung eines
#      Standes passiert NACH dem Zusammenfuehren und nicht davor.
#   2. DER LAUF FUER EINE ANFRAGE AUS EINEM FREMDEN ABZUG. Dort gibt es
#      keinen Push in dieses Repository; ohne das zweite Ereignis in dieser
#      Liste laeuft fuer sie gar nichts.
#
# Das ist der Preis, und er steht hier, damit ihn spaeter niemand fuer ein
# Versehen haelt. Wer einen Stand vor dem Zusammenfuehren geprueft sehen
# will, faehrt `npm test` oertlich -- der Pruefstand braucht GitHub nicht.
on:
  push:
    branches:
      - main

# Ein neuer Push auf main loest den vorigen Lauf ab. Zwei Laeufe auf einen
# ueberholten Stand sagen nichts, was der neuere nicht besser saegte.
#
# UM DIE MINUTEN GEHT ES DABEI SEIT DEM 9. SEPTEMBER 2026 NICHT MEHR: das
# Repository ist oeffentlich, und die Standardlaeufer sind damit unbegrenzt
# kostenlos. Es bleibt eine Frage der Ordnung -- wer die Liste liest, soll
# nicht pruefen muessen, ob zwei Eintraege zwei Staende sind oder ein Stand
# mit zwei Laeufen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DIE VERSION AUS DEM ABBILD, nicht die zufaellig neueste. Laeuft der
      # Prueflauf gegen eine andere als der Container, prueft er etwas, das so
      # nirgends betrieben wird. Der Pruefstand haelt beide Zahlen gegeneinander
      # -- wer hier eine aendert, wird namentlich rot.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci und nicht npm install: derselbe Grund wie im Dockerfile -- nur so
      # wird das Lockfile gelesen, und ein Auseinanderlaufen von package.json
      # und Lockfile ist hier ein Fehler und kein stiller Ausweg.
      - name: Abhaengigkeiten
        run: npm ci

      - name: Pruefstand
        run: npm test

      # UEBER ALLE Abhaengigkeiten, auch die zum Entwickeln. Sich hier auf
      # --omit=dev zurueckzuziehen waere ein Herabsetzen der Schwelle durch die
      # Hintertuer -- und genau das soll nicht passieren. Bleibt etwas uebrig,
      # gehoert es gemeldet und angesehen.
      - name: Bekannte Luecken
        run: npm audit --audit-level=high
