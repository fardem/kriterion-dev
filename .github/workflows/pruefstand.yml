# Der Pruefstand laeuft bei jedem Push und an jeder Anfrage von aussen.
#
# Bisher lief er nur, wenn jemand daran dachte. Die Schluesselwoerter sind
# englisch, weil GitHub sie so liest; alles andere steht auf Deutsch.
name: Pruefstand

on: [push, pull_request]

# Ein neuer Push auf denselben Zweig loest den vorigen Lauf ab. Fuer ein
# privates Repository sind die Minuten gedeckelt, und zwei Laeufe auf einen
# ueberholten Stand sagen nichts, was der neuere nicht besser saegte.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    # EIN LAUF JE STAND -- 0.25.0, Bauabschnitt 5 (Weg B). Ein Zweig in
    # DIESEM Repository wird schon beim Push geprueft; die Anfrage darauf
    # liefe ein zweites Mal ueber denselben Stand und saegte dasselbe noch
    # einmal. Sie zeigt das Haekchen trotzdem, weil Pruefergebnisse an der
    # COMMIT-KENNUNG haengen und nicht am Ereignis.
    #
    # EINE ANFRAGE AUS EINEM FREMDEN ABZUG WIRD WEITERHIN GEPRUEFT: dort gibt
    # es keinen Push in dieses Repository, und ohne diese Zeile liefe fuer sie
    # gar nichts.
    #
    # DER GRUND IST SEIT DEM 9. SEPTEMBER 2026 EIN ANDERER. Das Repository ist
    # oeffentlich, und damit sind die Standardlaeufer bei GitHub unbegrenzt
    # kostenlos -- die Minuten, um die es beim Beschluss ging, kosten nichts
    # mehr. Weg B bleibt aus zwei Gruenden, die von der Rechnung unabhaengig
    # sind: zwei Laeufe am selben Stand sagen dasselbe zweimal -- wer die Liste
    # liest, muss jedes Mal pruefen, ob es zwei Staende oder ein Stand mit zwei
    # Laeufen sind --, und der zweite Lauf belegt eine halbe Viertelstunde
    # Rechenzeit fuer eine Antwort, die schon dasteht. Es ist ab jetzt eine
    # Frage der Ordnung und nicht des Geldes.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@v4

      # DIE VERSION AUS DEM ABBILD, nicht die zufaellig neueste. Laeuft der
      # Prueflauf gegen eine andere als der Container, prueft er etwas, das so
      # nirgends betrieben wird. Der Pruefstand haelt beide Zahlen gegeneinander
      # -- wer hier eine aendert, wird namentlich rot.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci und nicht npm install: derselbe Grund wie im Dockerfile -- nur so
      # wird das Lockfile gelesen, und ein Auseinanderlaufen von package.json
      # und Lockfile ist hier ein Fehler und kein stiller Ausweg.
      - name: Abhaengigkeiten
        run: npm ci

      - name: Pruefstand
        run: npm test

      # UEBER ALLE Abhaengigkeiten, auch die zum Entwickeln. Sich hier auf
      # --omit=dev zurueckzuziehen waere ein Herabsetzen der Schwelle durch die
      # Hintertuer -- und genau das soll nicht passieren. Bleibt etwas uebrig,
      # gehoert es gemeldet und angesehen.
      - name: Bekannte Luecken
        run: npm audit --audit-level=high
